openapi: 3.1.1
info:
  title: Task Manager API, Erscheinungsbild (TASK-036, TASK-040, TASK-081, TASK-082)
  version: 0.3.0
  description: |
    Name, Akzentfarbe und Logo des Unternehmens. Lesen darf jede vollständige Anmeldung, ändern nur, wer das Unternehmensrecht
    `appearance.manage` des Berechtigungsmoduls hält (sonst 403 `auth.forbidden`, TASK-040). Sitzung, CSRF und
    `Cache-Control: no-store` gelten wie im Identitätsvertrag. Der `ETag` ist die Version der Einstellung; jede Änderung
    braucht sie als `If-Match`. Fehlt der Kopf, antwortet der Server mit 428, passt er nicht, mit 412.

    Unter `/appearance/public` liest die Anmeldeseite ohne Sitzung nur Name, Akzentfarbe und Logo, ohne Version, Zeitpunkt
    oder bearbeitende Person (TASK-081). Sie gelten für die Installation; kein Parameter der Anfrage wählt einen anderen
    Auftritt. Auch eine Sitzung mit ausstehendem Passwortwechsel und ein abgelaufenes Sitzungscookie lesen sie.

    Unter `/appearance/mail-template` pflegt, wer `appearance.manage` hält, die Mailvorlage „Antwort an Kunden“ (TASK-082,
    DEC-112): Anrede, Signatur und Fußzeile je Sprache als einfacher Text mit Platzhaltern und die Adresse der Anwendung für
    `{{portal.url}}`. Lesen, Ändern, Zurücksetzen und Vorschau brauchen das Recht; die Vorschau nutzt nur synthetische Werte.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /appearance:
    get:
      operationId: getAppearance
      summary: Aktuelles Erscheinungsbild
      responses:
        '200':
          description: Name, Akzentfarbe, Logo und Version
          headers:
            ETag: {schema: {type: string}, description: 'Version in Anführungszeichen, zum Beispiel "3"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: changeAppearance
      summary: Akzentfarbe, Name oder beides ändern (Recht appearance.manage)
      description: |
        Ein nicht gesendeter Teil bleibt unverändert; ohne beide Teile 400 `appearance.change_empty`. Der Name wird an
        den Rändern gekürzt und muss danach 1 bis 80 Zeichen ohne Steuer- oder Formatzeichen haben (sonst 400
        `appearance.name_invalid`). Jeder geänderte Teil erhält einen eigenen Eintrag im Prüfprotokoll.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppearanceChange'}
      responses:
        '200':
          description: Geändert. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: resetAppearance
      summary: Alles zurücksetzen (Recht appearance.manage)
      description: Setzt Name, Akzentfarbe und Logo in einem Schritt auf den Standard (TASK-081).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Zurückgesetzt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /appearance/public:
    get:
      operationId: getPublicAppearance
      summary: Auftritt für die Anmeldeseite, ohne Sitzung
      security: []
      responses:
        '200':
          description: Nur Name, Akzentfarbe und Adresse des öffentlichen Logos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicAppearance'}
  /appearance/public/logo:
    get:
      operationId: getPublicLogo
      summary: Logo für die Anmeldeseite, ohne Sitzung
      description: Dieselben Bilddaten und Köpfe wie `/appearance/logo`. Ohne Logo 404 mit `appearance.logo_not_found`.
      security: []
      responses:
        '200':
          description: Bilddaten
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Problem'}
  /appearance/logo:
    get:
      operationId: getLogo
      summary: Logo als Bild
      description: |
        Ausgeliefert mit `X-Content-Type-Options: nosniff` und `Content-Security-Policy: default-src 'none'; sandbox`.
        Ohne Logo 404 mit `appearance.logo_not_found`.
      responses:
        '200':
          description: Bilddaten
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: replaceLogo
      summary: Logo ersetzen (Recht appearance.manage)
      description: |
        PNG, JPEG oder WebP bis 512 KiB als Rohdaten. Der Typ wird an den ersten Bytes erkannt und muss zum
        `Content-Type` passen. SVG wird nicht angenommen, weil es Skript enthalten kann.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: Ersetzt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeLogo
      summary: Logo entfernen (Recht appearance.manage)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Entfernt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /appearance/mail-template:
    get:
      operationId: getMailTemplate
      summary: Mailvorlage „Antwort an Kunden“ (Recht appearance.manage)
      responses:
        '200':
          description: Texte je Sprache, eingebaute Vorlage, Platzhalter und Version
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailTemplate'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: changeMailTemplate
      summary: Mailvorlage speichern (Recht appearance.manage)
      description: |
        Speichert beide Sprachen und die Adresse der Anwendung. Ein Teil darf leer sein und höchstens 2 000 Zeichen haben,
        ohne Steuerzeichen außer Zeilenumbruch und Tabulator (sonst 400 `mail_template.text_invalid` mit der Sprache und dem
        Teil, etwa `de.signature`). Ein Platzhalter außerhalb des Katalogs und eine offene oder schließende Doppelklammer ohne
        Platzhalter werden mit 400 `mail_template.placeholder_unknown` abgelehnt; die Liste nennt Sprache, Teil und das
        Geschriebene, etwa `en.footer: {{ticket.nummer}}`. Die Adresse ist leer oder eine https Adresse mit Rechnername ohne
        Anmeldedaten (sonst 400 `mail_template.address_invalid`); das Schema wird kleingeschrieben gespeichert, etwa `HTTPS://` als `https://`. Fehlt eine Sprache, 400 `mail_template.languages_missing`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailTemplateChange'}
      responses:
        '200':
          description: Gespeichert. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailTemplate'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: resetMailTemplate
      summary: Zur eingebauten Vorlage zurückkehren (Recht appearance.manage)
      description: Beide Sprachen nutzen wieder die eingebaute Vorlage; die Adresse der Anwendung bleibt.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Zurückgesetzt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailTemplate'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /appearance/mail-template/preview:
    post:
      operationId: previewMailTemplate
      summary: Beispielmail mit ungespeicherten Texten (Recht appearance.manage)
      description: |
        Füllt die gesendeten Texte einer Sprache mit synthetischen Werten; Name und Akzentfarbe können ungespeichert
        mitgegeben werden, sonst gelten die gespeicherten. Geprüft wird wie beim Speichern; gespeichert wird nichts. Eine
        fehlende Sprache oder eine andere als `de` oder `en` wird mit 400 `mail_template.languages_missing` abgelehnt.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MailTemplatePreviewRequest'}
      responses:
        '200':
          description: Die fertige Beispielmail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MailPreview'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag der zuletzt gelesenen Fassung.
      schema: {type: string}
  responses:
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: appearance.color_invalid, appearance.name_invalid,
        appearance.change_empty, appearance.logo_empty,
        appearance.logo_type_invalid, appearance.logo_unreadable (415, beschädigte oder unvollständige Bilddatei, TASK-043), appearance.logo_not_found, appearance.version_conflict,
        appearance.precondition_required, mail_template.text_invalid, mail_template.placeholder_unknown,
        mail_template.address_invalid, mail_template.languages_missing, mail_template.version_conflict,
        mail_template.precondition_required, request.too_large, auth.required, auth.forbidden, auth.csrf_invalid,
        auth.password_change_required.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
      additionalProperties: true
    AppearanceChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        name: {type: string, minLength: 1, maxLength: 80}
    PublicAppearance:
      type: object
      additionalProperties: false
      required: [name, accentColor, logoUrl]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        accentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        logoUrl:
          description: '`/api/v1/appearance/public/logo` oder null ohne Logo'
          oneOf:
            - type: string
            - type: 'null'
    Logo:
      type: object
      required: [contentType, size, url]
      properties:
        contentType: {type: string, enum: [image/png, image/jpeg, image/webp]}
        size: {type: integer, minimum: 1, maximum: 524288}
        url: {type: string, description: 'Pfad auf dem eigenen Server, mit der Version als Abfrageparameter'}
    Appearance:
      type: object
      required: [name, defaultName, accentColor, defaultAccentColor, logo, version, updatedAt]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        defaultName: {type: string, minLength: 1, maxLength: 80}
        accentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        defaultAccentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        logo:
          oneOf:
            - $ref: '#/components/schemas/Logo'
            - type: 'null'
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
    MailTexts:
      type: object
      required: [greeting, signature, footer]
      properties:
        greeting: {type: string, maxLength: 2000}
        signature: {type: string, maxLength: 2000}
        footer: {type: string, maxLength: 2000}
    MailLanguage:
      type: object
      required: [greeting, signature, footer, stored, builtIn]
      properties:
        greeting: {type: string, maxLength: 2000}
        signature: {type: string, maxLength: 2000}
        footer: {type: string, maxLength: 2000}
        stored: {type: boolean, description: 'false, solange die eingebaute Vorlage gilt'}
        builtIn: {$ref: '#/components/schemas/MailTexts'}
    MailTemplate:
      type: object
      required: [applicationUrl, de, en, placeholders, version, updatedAt]
      properties:
        applicationUrl:
          description: Adresse der Anwendung für `{{portal.url}}`; ohne Adresse entfällt die Zeile mit dem Link
          oneOf:
            - type: string
            - type: 'null'
        de: {$ref: '#/components/schemas/MailLanguage'}
        en: {$ref: '#/components/schemas/MailLanguage'}
        placeholders:
          type: array
          items: {type: string, enum: [company.name, contact.name, ticket.number, ticket.title, sender.name, mailbox.address, portal.url]}
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
    MailTemplateChange:
      type: object
      additionalProperties: false
      required: [de, en]
      properties:
        applicationUrl:
          oneOf:
            - type: string
            - type: 'null'
        de: {$ref: '#/components/schemas/MailTexts'}
        en: {$ref: '#/components/schemas/MailTexts'}
    MailTemplatePreviewRequest:
      type: object
      additionalProperties: false
      required: [language, texts]
      properties:
        language: {type: string, enum: [de, en]}
        applicationUrl:
          oneOf:
            - type: string
            - type: 'null'
        texts: {$ref: '#/components/schemas/MailTexts'}
        name: {type: string, minLength: 1, maxLength: 80}
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    MailParts:
      type: object
      description: Die Teile der Mail im Layout, für eine Vorschau in der Anwendung
      required: [name, accentColor, logo, greeting, body, signature, footer]
      properties:
        name: {type: string}
        accentColor: {type: string}
        logo: {type: boolean}
        greeting: {type: string}
        body: {type: string}
        signature: {type: string}
        footer: {type: string}
    MailPreview:
      type: object
      required: [language, text, html, parts]
      properties:
        language: {type: string, enum: [de, en]}
        text: {type: string, description: Der Klartext der Mail}
        html: {type: string, description: 'Das HTML der Mail; das Logo steht dort als cid:logo'}
        parts: {$ref: '#/components/schemas/MailParts'}
