openapi: 3.1.1
info:
  title: Task Manager API, Erscheinungsbild (TASK-036, TASK-040, TASK-081)
  version: 0.2.0
  description: |
    Name, Akzentfarbe und Logo des Unternehmens. Lesen darf jede vollständige Anmeldung, ändern nur, wer das Unternehmensrecht
    `appearance.manage` des Berechtigungsmoduls hält (sonst 403 `auth.forbidden`, TASK-040). Sitzung, CSRF und
    `Cache-Control: no-store` gelten wie im Identitätsvertrag. Der `ETag` ist die Version der Einstellung; jede Änderung
    braucht sie als `If-Match`. Fehlt der Kopf, antwortet der Server mit 428, passt er nicht, mit 412.

    Unter `/appearance/public` liest die Anmeldeseite ohne Sitzung nur Name, Akzentfarbe und Logo, ohne Version, Zeitpunkt
    oder bearbeitende Person (TASK-081). Sie gelten für die Installation; kein Parameter der Anfrage wählt einen anderen
    Auftritt. Auch eine Sitzung mit ausstehendem Passwortwechsel und ein abgelaufenes Sitzungscookie lesen sie.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /appearance:
    get:
      operationId: getAppearance
      summary: Aktuelles Erscheinungsbild
      responses:
        '200':
          description: Name, Akzentfarbe, Logo und Version
          headers:
            ETag: {schema: {type: string}, description: 'Version in Anführungszeichen, zum Beispiel "3"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      operationId: changeAppearance
      summary: Akzentfarbe, Name oder beides ändern (Recht appearance.manage)
      description: |
        Ein nicht gesendeter Teil bleibt unverändert; ohne beide Teile 400 `appearance.change_empty`. Der Name wird an
        den Rändern gekürzt und muss danach 1 bis 80 Zeichen ohne Steuer- oder Formatzeichen haben (sonst 400
        `appearance.name_invalid`). Jeder geänderte Teil erhält einen eigenen Eintrag im Prüfprotokoll.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppearanceChange'}
      responses:
        '200':
          description: Geändert. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: resetAppearance
      summary: Alles zurücksetzen (Recht appearance.manage)
      description: Setzt Name, Akzentfarbe und Logo in einem Schritt auf den Standard (TASK-081).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Zurückgesetzt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /appearance/public:
    get:
      operationId: getPublicAppearance
      summary: Auftritt für die Anmeldeseite, ohne Sitzung
      security: []
      responses:
        '200':
          description: Nur Name, Akzentfarbe und Adresse des öffentlichen Logos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicAppearance'}
  /appearance/public/logo:
    get:
      operationId: getPublicLogo
      summary: Logo für die Anmeldeseite, ohne Sitzung
      description: Dieselben Bilddaten und Köpfe wie `/appearance/logo`. Ohne Logo 404 mit `appearance.logo_not_found`.
      security: []
      responses:
        '200':
          description: Bilddaten
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/Problem'}
  /appearance/logo:
    get:
      operationId: getLogo
      summary: Logo als Bild
      description: |
        Ausgeliefert mit `X-Content-Type-Options: nosniff` und `Content-Security-Policy: default-src 'none'; sandbox`.
        Ohne Logo 404 mit `appearance.logo_not_found`.
      responses:
        '200':
          description: Bilddaten
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    put:
      operationId: replaceLogo
      summary: Logo ersetzen (Recht appearance.manage)
      description: |
        PNG, JPEG oder WebP bis 512 KiB als Rohdaten. Der Typ wird an den ersten Bytes erkannt und muss zum
        `Content-Type` passen. SVG wird nicht angenommen, weil es Skript enthalten kann.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        '200':
          description: Ersetzt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeLogo
      summary: Logo entfernen (Recht appearance.manage)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Entfernt. Neue Version im ETag.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appearance'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag der zuletzt gelesenen Fassung.
      schema: {type: string}
  responses:
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: appearance.color_invalid, appearance.name_invalid,
        appearance.change_empty, appearance.logo_empty,
        appearance.logo_type_invalid, appearance.logo_unreadable (415, beschädigte oder unvollständige Bilddatei, TASK-043), appearance.logo_not_found, appearance.version_conflict,
        appearance.precondition_required, request.too_large, auth.required, auth.forbidden, auth.csrf_invalid,
        auth.password_change_required.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
      additionalProperties: true
    AppearanceChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        accentColor: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        name: {type: string, minLength: 1, maxLength: 80}
    PublicAppearance:
      type: object
      additionalProperties: false
      required: [name, accentColor, logoUrl]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        accentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        logoUrl:
          description: '`/api/v1/appearance/public/logo` oder null ohne Logo'
          oneOf:
            - type: string
            - type: 'null'
    Logo:
      type: object
      required: [contentType, size, url]
      properties:
        contentType: {type: string, enum: [image/png, image/jpeg, image/webp]}
        size: {type: integer, minimum: 1, maximum: 524288}
        url: {type: string, description: 'Pfad auf dem eigenen Server, mit der Version als Abfrageparameter'}
    Appearance:
      type: object
      required: [name, defaultName, accentColor, defaultAccentColor, logo, version, updatedAt]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        defaultName: {type: string, minLength: 1, maxLength: 80}
        accentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        defaultAccentColor: {type: string, pattern: '^#[0-9a-f]{6}$'}
        logo:
          oneOf:
            - $ref: '#/components/schemas/Logo'
            - type: 'null'
        version: {type: integer, minimum: 1}
        updatedAt: {type: string, format: date-time}
