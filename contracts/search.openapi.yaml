openapi: 3.1.1
info:
  title: Task Manager API, Suche (TASK-029, TASK-044, TASK-073, TASK-102, TASK-103, TASK-104)
  version: 0.5.0
  description: |
    Suche und Filter für Tickets und Projekte (DEC-069). Alle Aufrufe verlangen eine vollständige interne Anmeldung;
    Sitzung, CSRF und `Cache-Control: no-store` gelten wie im Identitätsvertrag. Portalkonten erhalten bis zur
    Entscheidung über das Portal keine Suche (403).

    Rechte zuerst: Jede Suche prüft die aktuellen Rechte der anfragenden Person, bevor sie vergleicht, ordnet oder zählt.
    Tickets findet nur, wer im Projekt Mitglied ist und dort `ticket.read` hat. Suchwörter treffen nur Felder, die die
    Person lesen darf (Titel, Beschreibung, Tagnamen über die Leseregel des Feldes `tags`), ein Filter auf ein nicht
    lesbares Feld trifft im betreffenden Projekt nichts, und Rang, `total` und Seite entstehen nur aus erlaubten Treffern.
    Ein verborgenes Feld ändert also weder, ob ein Ticket gefunden wird, noch wo es steht. Projekte findet, wer
    `projects.manage` für das Unternehmen hat (alle Projekte), sonst Mitglieder mit `project.read` oder `project.manage`.

    Suchtext: Unicode NFKC, höchstens 200 Zeichen, zerlegt in Wörter aus Buchstaben und Ziffern, höchstens 10 Wörter zu je
    höchstens 50 Zeichen (sonst 400 mit `q.invalid`). Jedes Wort muss als Wortanfang vorkommen, ohne Unterschied der Groß
    und Kleinschreibung und ohne sprachabhängige Wortstämme. Ein Text ohne Wörter trifft nichts. Ein Text der Form
    `KEY-12` nennt zusätzlich das Ticket 12 des Projekts KEY und steht dann vorn. Sonderzeichen sind keine Suchsyntax.

    Filter: Wiederholte Werte eines Filters verbinden sich mit oder, verschiedene Filter mit und. Die genannten Tags
    (höchstens 10) wirken nach `tagMatch` (TASK-073, DEC-103): `all` (Vorgabe) verlangt jeden, `any` mindestens einen,
    `none` keinen davon, `untagged` nimmt keinen Tag und findet nur Tickets oder Projekte ohne Tag. Alle Tags an einem
    Ticket stammen aus dem Unternehmenskatalog oder dem Katalog seines Projekts und sind damit für jede Person sichtbar, die
    die Tags des Tickets liest; ohne Leseregel für `tags` trifft jeder Tagfilter in diesem Projekt nichts, auch `none` und
    `untagged`. Ein Projekt außerhalb der eigenen Suche antwortet mit `project.unknown`, ein unbekannter oder nicht
    sichtbarer Tag mit `tag.unknown`. Sichtbar sind der Unternehmenskatalog und die Kataloge der Projekte, in denen die
    Person Tickets lesen darf; für Projekte gilt nur der Unternehmenskatalog.

    Eigene Felder (TASK-044, DEC-073) gelten wie die festen Felder: Suchwörter treffen die Werte der lesbaren eigenen Felder
    der Arten Kurztext und Langtext, der Filter `custom` verlangt einen genauen Wert eines lesbaren eigenen Feldes, und
    `customFields` im Treffer zeigt nur lesbare Werte. Auch hier ändert ein verborgenes Feld weder das Ergebnis noch die
    Reihenfolge.

    Wikiseiten (TASK-102, DEC-132): Durchsucht werden Titel und sichtbarer Text jeder Sprachfassung. Der Text stammt aus
    dem vom Server geprüften Dokument: Absätze, Überschriften, Listen, Tabellen, Zitate, Codeblöcke und die Texte externer
    Links, ohne Bilder, Linkadressen und Texte von Links auf Wikiseiten. Gesucht wird in den Projekten, in denen die Person
    Mitglied ist und eine Wikiaktion hat. Ohne `drafts` nur in der veröffentlichten Revision jeder Sprachfassung, mit
    `drafts=true` stattdessen im aktuellen Entwurf und nur in Projekten mit `wiki.edit` oder `wiki.publish`. Archivierte
    Seiten nur mit `archived=true` und nur in Projekten mit `wiki.publish`, wie das Wiki sie zeigt. Wer `drafts` oder
    `archived` ohne ein solches Projekt verlangt, erhält 403. Jede Sprachfassung trifft für sich: jedes Wort im Titel oder im
    Text dieser Fassung. Eine Seite ist ein Treffer; treffen beide Fassungen, zeigt er die in `preferred`, sonst die
    Ausgangssprache der Seite. Ordnung nach Rang (Titelwörter zählen doppelt), dann Titel. Vom Text werden höchstens die
    ersten 200.000 Byte der Suchwörter durchsucht.

    Anforderungen (TASK-103, DEC-133): Durchsucht werden Titel, Beschreibung (sichtbarer Text des Dokuments), die Texte der
    Abnahmekriterien und eigene Felder der Arten Kurztext und Langtext; eigene Felder anderer Arten filtern mit `custom`
    wie bei Tickets. Gesucht wird in den Projekten, in denen die Person Mitglied ist und `requirement.read` hat. Suchwörter
    treffen nur Felder, deren Leseregel die Person hat; ein Filter auf ein nicht lesbares Feld (`priority`, `owner`,
    `custom`) trifft im betreffenden Projekt nichts, und Rang, `total`, Seite und Ausschnitt entstehen nur aus lesbaren
    Feldern. Ohne `stage` gilt die aktuelle Revision, mit `stage=approved` nur die zuletzt freigegebene Revision; beide
    Stände mischen sich nie. Der Schlüssel `ANF-n`, mit dem Projektschlüssel davor (`HELP ANF-17`) oder allein, findet die
    Anforderung für jede Person, die sie lesen darf, und steht dann vorn. Verworfene Anforderungen erscheinen nur mit einem
    Filter `status`. Ordnung nach Rang (Titelwörter zählen doppelt), dann Projektschlüssel und Nummer absteigend.

    Übersicht (TASK-104, DEC-134): `/search/all` liefert je Bereich die ersten fünf Treffer und `total` nach den Regeln
    des eigenen Endpunkts (Tickets und Projekte wie oben, Wikiseiten in der veröffentlichten Revision, Anforderungen in
    der aktuellen Revision), ohne gemeinsame Rangliste. Ein Bereich, in dem die Person in keinem Projekt die Leseaktion
    hat, ist `null`. Nennt der Text genau eine lesbare Kennung (`HELP-12`, `HELP ANF-17` oder einen Projektschlüssel),
    steht sie in `direct`; sonst ist `direct` `null`, gleich ob es das Objekt gibt.

    Ordnung: Rang absteigend, dann Projektschlüssel und Ticketnummer absteigend (Projekte nach Schlüssel; ein Text, der
    genau ein Projektschlüssel ist, stellt dieses Projekt vorn). Der Index folgt
    jeder Änderung in derselben Transaktion. Kann eine Sperre nicht rechtzeitig genommen werden, antwortet der Server
    mit 503 `search.busy` und `Retry-After`; die Suche darf wiederholt werden.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /search/tickets:
    get:
      operationId: searchTickets
      summary: Tickets suchen und filtern
      parameters:
        - $ref: '#/components/parameters/Text'
        - name: project
          in: query
          description: Projektkennung, wiederholbar (höchstens 20).
          schema: {type: array, items: {type: string, format: uuid}, maxItems: 20}
          explode: true
        - name: status
          in: query
          description: Statusschlüssel, wiederholbar.
          schema: {type: array, items: {type: string, minLength: 1, maxLength: 100}, maxItems: 20}
          explode: true
        - name: type
          in: query
          description: Typschlüssel, wiederholbar.
          schema: {type: array, items: {type: string, minLength: 1, maxLength: 100}, maxItems: 20}
          explode: true
        - name: assignee
          in: query
          description: Konto der Zuständigkeit, wiederholbar.
          schema: {type: array, items: {type: string, format: uuid}, maxItems: 20}
          explode: true
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/TagMatch'
        - name: custom
          in: query
          description: |
            Eigenes Feld in der Form `<schlüssel>=<wert>`, wiederholbar (höchstens 20); das Ticket muss genau diesen Wert
            tragen, jeder genannte Filter muss zutreffen. Der Wert steht so, wie die Ticketschnittstelle ihn führt:
            Optionsschlüssel, Kennung des Kontos, `true` oder `false`, Datum `yyyy-MM-dd`, Zahl oder Text. Ungültig ist
            ein Schlüssel außerhalb von `^[a-z][a-z0-9_]{0,39}$` oder ein leerer oder zu langer Wert (`custom.invalid`).
            In Projekten ohne dieses lesbare Feld trifft der Filter nichts.
          schema: {type: array, items: {type: string, minLength: 3, maxLength: 242}, maxItems: 20}
          explode: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Treffer
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TicketHit'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /search/projects:
    get:
      operationId: searchProjects
      summary: Projekte nach Schlüssel, Name, Beschreibung und Tags suchen
      parameters:
        - $ref: '#/components/parameters/Text'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/TagMatch'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Treffer
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProjectHit'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /search/wiki:
    get:
      operationId: searchWiki
      summary: Wikiseiten suchen (TASK-102)
      parameters:
        - $ref: '#/components/parameters/Text'
        - name: project
          in: query
          description: Projektkennung, wiederholbar (höchstens 20); ein Projekt ohne Wikiaktion antwortet mit `project.unknown`.
          schema: {type: array, items: {type: string, format: uuid}, maxItems: 20}
          explode: true
        - name: language
          in: query
          description: Nur diese Sprachfassungen durchsuchen; ohne Angabe beide. Ein anderer Wert antwortet mit `language.invalid`.
          schema: {type: string, enum: [de, en]}
        - name: preferred
          in: query
          description: Sprache der Oberfläche; ihre Fassung zeigt ein Treffer, wenn beide Fassungen treffen, sonst die Quellsprache. Vorgabe `de`; ein anderer Wert antwortet mit `preferred.invalid`.
          schema: {type: string, enum: [de, en]}
        - name: drafts
          in: query
          description: |
            Im aktuellen Entwurf statt in der veröffentlichten Revision suchen, nie gemischt. Vorgabe `false`. Durchsucht nur
            Projekte mit `wiki.edit` oder `wiki.publish`; fehlt beides in jedem Mitgliedsprojekt, antwortet der Server mit 403
            `auth.forbidden`. Ein anderer Wert als `true` oder `false` antwortet mit `drafts.invalid`.
          schema: {type: string, enum: ['true', 'false']}
        - name: archived
          in: query
          description: |
            Archivierte Seiten einbeziehen, gekennzeichnet mit `archived`. Vorgabe `false`. Nur in Projekten mit `wiki.publish`,
            wie das Wiki selbst archivierte Seiten zeigt (DEC-132); fehlt es in jedem Mitgliedsprojekt, antwortet der Server mit
            403 `auth.forbidden`. Ein anderer Wert als `true` oder `false` antwortet mit `archived.invalid`.
          schema: {type: string, enum: ['true', 'false']}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Treffer
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/WikiHit'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /search/requirements:
    get:
      operationId: searchRequirements
      summary: Anforderungen suchen und filtern (TASK-103)
      parameters:
        - $ref: '#/components/parameters/Text'
        - name: project
          in: query
          description: Projektkennung, wiederholbar (höchstens 20); ein Projekt ohne `requirement.read` antwortet mit `project.unknown`.
          schema: {type: array, items: {type: string, format: uuid}, maxItems: 20}
          explode: true
        - name: stage
          in: query
          description: |
            `current` (Vorgabe) durchsucht die aktuelle Revision, `approved` nur die zuletzt freigegebene Revision; Anforderungen
            ohne Freigabe fehlen dann. Ein anderer Wert antwortet mit `stage.invalid`.
          schema: {type: string, enum: [current, approved]}
        - name: status
          in: query
          description: Status, wiederholbar; nur mit diesem Filter erscheinen verworfene Anforderungen. Ein anderer Wert antwortet mit `status.invalid`.
          schema: {type: array, items: {type: string, enum: [draft, review, approved, discarded]}, maxItems: 20}
          explode: true
        - name: priority
          in: query
          description: Priorität im gesuchten Stand, wiederholbar; trifft nur mit Leseregel für `priority`. Ein anderer Wert antwortet mit `priority.invalid`.
          schema: {type: array, items: {type: string, enum: [low, normal, high, critical]}, maxItems: 20}
          explode: true
        - name: owner
          in: query
          description: Kennung der verantwortlichen Person, wiederholbar; trifft nur mit Leseregel für `owner`.
          schema: {type: array, items: {type: string, format: uuid}, maxItems: 20}
          explode: true
        - name: approved
          in: query
          description: '`true` nur Anforderungen, die je freigegeben wurden, `false` nur solche ohne Freigabe. Ein anderer Wert antwortet mit `approved.invalid`.'
          schema: {type: string, enum: ['true', 'false']}
        - name: custom
          in: query
          description: '`<schlüssel>=<wert>` eines lesbaren eigenen Feldes der Anforderungen im gesuchten Stand, wiederholbar, wie bei Tickets.'
          schema: {type: array, items: {type: string, maxLength: 241}, maxItems: 20}
          explode: true
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Treffer
          content:
            application/json:
              schema:
                type: object
                required: [total, items]
                properties:
                  total: {type: integer, minimum: 0}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RequirementHit'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /search/all:
    get:
      operationId: searchAll
      summary: Übersicht „Alle“ und Schnellsuche (TASK-104)
      parameters:
        - $ref: '#/components/parameters/Text'
        - name: preferred
          in: query
          description: Sprache der Oberfläche für Wikitreffer wie bei `/search/wiki`. Vorgabe `de`; ein anderer Wert antwortet mit `preferred.invalid`.
          schema: {type: string, enum: [de, en]}
      responses:
        '200':
          description: Je Bereich höchstens fünf Treffer und die Anzahl; `null` für einen Bereich ohne Recht.
          content:
            application/json:
              schema:
                type: object
                required: [tickets, projects, wiki, requirements, direct]
                properties:
                  tickets:
                    oneOf:
                      - type: object
                        required: [total, items]
                        properties:
                          total: {type: integer, minimum: 0}
                          items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/TicketHit'}}
                      - {type: 'null'}
                  projects:
                    oneOf:
                      - type: object
                        required: [total, items]
                        properties:
                          total: {type: integer, minimum: 0}
                          items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ProjectHit'}}
                      - {type: 'null'}
                  wiki:
                    oneOf:
                      - type: object
                        required: [total, items]
                        properties:
                          total: {type: integer, minimum: 0}
                          items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/WikiHit'}}
                      - {type: 'null'}
                  requirements:
                    oneOf:
                      - type: object
                        required: [total, items]
                        properties:
                          total: {type: integer, minimum: 0}
                          items: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/RequirementHit'}}
                      - {type: 'null'}
                  direct:
                    oneOf:
                      - {$ref: '#/components/schemas/Direct'}
                      - {type: 'null'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    Text:
      name: q
      in: query
      description: Suchtext; ohne ihn gelten nur die Filter.
      schema: {type: string, maxLength: 200}
    Tag:
      name: tag
      in: query
      description: Tagkennung, wiederholbar (höchstens 10, sonst `tag.invalid`); wie sie wirkt, sagt `tagMatch`.
      schema: {type: array, items: {type: string, format: uuid}, maxItems: 10}
      explode: true
    TagMatch:
      name: tagMatch
      in: query
      description: |
        `all`, `any` und `none` verlangen mindestens einen Tag, `untagged` keinen; sonst 400 `tagMatch.invalid`.
      schema: {type: string, enum: [all, any, none, untagged], default: all}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 1000, default: 0}
  responses:
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: request.invalid, search.busy, auth.required, auth.forbidden,
        auth.password_change_required. Gründe in `violations`: q.invalid, project.invalid, project.unknown,
        status.invalid, type.invalid, assignee.invalid, tag.invalid, tag.unknown, custom.invalid, paging.invalid, und für
        `/search/wiki` language.invalid, preferred.invalid, drafts.invalid, archived.invalid, für `/search/requirements`
        stage.invalid, priority.invalid, owner.invalid, approved.invalid, für `/search/all` q.invalid und preferred.invalid.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
        Retry-After: {schema: {type: integer}, description: Nur bei 503.}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
      additionalProperties: true
    Direct:
      type: object
      description: |
        Das Objekt, das der Text genau nennt und das die Person lesen darf (TASK-104): `ticket` für `KEY-12` mit der
        Kennung des Tickets, `requirement` für `KEY ANF-17` mit der Kennung der Anforderung, `project` für einen
        Projektschlüssel mit der Kennung des Projekts. `key` ist die Kennung, wie sie angezeigt wird, `number` die Nummer
        des Tickets oder der Anforderung, bei einem Projekt `null`.
      required: [kind, id, projectId, key, number]
      properties:
        kind: {type: string, enum: [ticket, requirement, project]}
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        key: {type: string}
        number: {type: [integer, 'null'], minimum: 1}
    TagRef:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    TicketHit:
      type: object
      required: [id, projectId, key, number, fields, customFields, tags]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        key: {type: string, description: 'Projektschlüssel und Nummer, zum Beispiel "KUNDE-12"'}
        number: {type: integer, minimum: 1}
        fields:
          description: Nur die lesbaren Felder unter title, description, type, status und assignee; ein verborgenes Feld fehlt.
          type: object
          additionalProperties: {type: [string, 'null']}
        customFields:
          description: |
            Die lesbaren eigenen Felder mit Wert, nach Schlüssel; jeder Wert in der Textform, in der der Filter `custom` ihn
            erwartet.
          type: object
          additionalProperties: {type: string}
        tags:
          description: Zugeordnete Tags nach Namen; null ohne Leseregel für das Feld `tags`.
          type: [array, 'null']
          items: {$ref: '#/components/schemas/TagRef'}
    ProjectHit:
      type: object
      required: [id, key, name, description, tags]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        tags:
          type: array
          items: {$ref: '#/components/schemas/TagRef'}
    Mark:
      type: object
      description: Stelle eines gefundenen Worts, Versatz in UTF-16 Codeeinheiten, Ende ausschließlich.
      required: [start, end]
      properties:
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 1}
    Snippet:
      type: object
      description: |
        Ausschnitt des Texts als Klartext, nie HTML, um das erste gefundene Wort (sonst der Anfang), mit den Stellen der
        gefundenen Wörter. `cutStart` und `cutEnd` sagen, ob davor oder danach Text fehlt.
      required: [text, marks, cutStart, cutEnd]
      properties:
        text: {type: string}
        marks:
          type: array
          items: {$ref: '#/components/schemas/Mark'}
        cutStart: {type: boolean}
        cutEnd: {type: boolean}
    PathEntry:
      type: object
      description: |
        Eine Ebene über der gefundenen Seite, von oben bis zur Wurzel; keine Ebene wird ausgelassen. Im Stand `published`
        trägt eine nicht archivierte Elternseite mit veröffentlichter Fassung ihren veröffentlichten Titel; im Stand `draft`
        trägt jede nicht archivierte Elternseite ihren Entwurfstitel. Jede andere Ebene, auch eine archivierte Elternseite, ist
        nicht verfügbar und erscheint als „Seite nicht verfügbar“. Eine verfügbare Ebene hat immer Kennung und Titel, eine nicht
        verfügbare nie.
      oneOf:
        - type: object
          required: [id, title, available]
          properties:
            id: {type: string, format: uuid}
            title: {type: string}
            available: {const: true}
        - type: object
          required: [id, title, available]
          properties:
            id: {type: 'null'}
            title: {type: 'null'}
            available: {const: false}
    WikiHit:
      type: object
      required: [id, projectId, projectKey, title, titleMarks, language, stage, revision, publishedAt, archived, path, snippet]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectKey: {type: string}
        title: {type: string, description: Titel der gezeigten Fassung im gesuchten Stand.}
        titleMarks:
          type: array
          items: {$ref: '#/components/schemas/Mark'}
        language: {type: string, enum: [de, en], description: Sprache der gezeigten Fassung.}
        stage: {type: string, enum: [published, draft]}
        revision: {type: integer, minimum: 1}
        publishedAt: {type: [string, 'null'], format: date-time, description: Zeitpunkt der Veröffentlichung, nur bei `published`.}
        archived: {type: boolean}
        path:
          type: array
          description: |
            Pfad im gesuchten Stand: jede Ebene über der Seite von oben bis zur Wurzel, nach den Regeln von `PathEntry`. Er
            folgt nicht den Brotkrumen der Seitenansicht, die nur sichtbare Seiten zeigen.
          items: {$ref: '#/components/schemas/PathEntry'}
        snippet:
          oneOf:
            - {$ref: '#/components/schemas/Snippet'}
            - {type: 'null'}
    RequirementSnippet:
      type: object
      description: |
        Ausschnitt aus dem ersten lesbaren Feld, das ein Suchwort enthält, in der Folge Beschreibung, Abnahmekriterien,
        eigene Textfelder; ohne Treffer dort der Anfang der lesbaren Beschreibung.
      required: [field, criterion, excerpt]
      properties:
        field: {type: string, description: '`description`, `criteria` oder `custom.<schlüssel>`.'}
        criterion: {type: [integer, 'null'], minimum: 1, description: Feste Nummer des Kriteriums, nur bei `criteria`.}
        excerpt: {$ref: '#/components/schemas/Snippet'}
    RequirementHit:
      type: object
      required: [id, projectId, projectKey, key, number, title, titleMarks, status, stage, revision, currentRevision, approvedRevision,
        approved, priority, owner, customFields, snippet]
      properties:
        id: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        projectKey: {type: string}
        key: {type: string, description: 'Zum Beispiel "ANF-17".'}
        number: {type: integer, minimum: 1}
        title: {type: [string, 'null'], description: Titel im gesuchten Stand; null ohne Leseregel für `title`.}
        titleMarks:
          type: array
          items: {$ref: '#/components/schemas/Mark'}
        status: {type: string, enum: [draft, review, approved, discarded]}
        stage: {type: string, enum: [current, approved]}
        revision: {type: integer, minimum: 1, description: Die durchsuchte Revision.}
        currentRevision: {type: integer, minimum: 1}
        approvedRevision: {type: [integer, 'null'], minimum: 1, description: Zuletzt freigegebene Revision; null ohne Freigabe.}
        approved: {type: boolean, description: Die durchsuchte Revision ist die zuletzt freigegebene.}
        priority: {type: [string, 'null'], enum: [low, normal, high, critical, null], description: null ohne Leseregel.}
        owner: {type: [string, 'null'], format: uuid, description: null ohne Leseregel oder ohne verantwortliche Person.}
        customFields:
          description: Die lesbaren eigenen Felder mit Wert im gesuchten Stand, in der Textform des Filters `custom`.
          type: object
          additionalProperties: {type: string}
        snippet:
          oneOf:
            - {$ref: '#/components/schemas/RequirementSnippet'}
            - {type: 'null'}
