openapi: 3.1.1
info:
  title: Task Manager API, Gruppen und Rechte (TASK-030, TASK-043)
  version: 0.3.0
  description: |
    Verwaltung der Gruppen, ihrer Mitglieder, Aktionen und Feldregeln des Berechtigungsmoduls (TASK-025, DEC-070). Jeder
    Aufruf verlangt eine vollständige Anmeldung und das Unternehmensrecht `permissions.manage`; fehlt es, ist es veraltet
    oder ist die Anmeldung nicht mehr gültig, antwortet der Server mit 403 `auth.forbidden`, ohne den Fall zu nennen. Sitzung,
    CSRF und `Cache-Control: no-store` gelten wie im Identitätsvertrag. Feste Rollen gibt es nicht: Gruppen werden frei
    angelegt und erhalten Aktionen und Feldregeln.

    Aktionen gelten für das Unternehmen oder für ein Projekt. Die Unternehmensaktionen des Katalogs (`companyActions`) gibt es
    nur ohne Projekt. Eine Projektaktion (`projectActions`) ohne Projekt gilt in jedem Projekt, in dem das Konto Mitglied ist;
    mit Projekt nur dort. Feldregeln erlauben (`allow`) oder verbieten (`deny`) das Lesen (`read`) oder Schreiben (`write`)
    eines Feldes, `remove` entfernt die Regel. Ein Verbot gewinnt über jede Erlaubnis, Schreiben setzt Lesen voraus.
    Maßgeblich sind die Regeln aller Gruppen eines Kontos zusammen.

    Projektverwaltungen (ein internes Konto mit `permissions.manage` für ein Projekt) lesen die Regeln ihres Projekts über
    `/permissions/projects/{projectId}/groups` und ändern sie über dieselben Endpunkte wie die Unternehmensverwaltung. Sie
    vergeben nur Projektaktionen, die sie dort selbst haben, und nur Feldregeln für Felder, die sie dort lesen und schreiben
    dürfen; `permissions.*` vergeben sie nie. Weil sie die ganze Gruppe nicht lesen dürfen, antwortet eine solche Änderung mit
    204. Externe Konten verwalten nie Rechte, auch wenn eine Gruppe ihnen `permissions.manage` gibt. Ein Projekt, das die
    anfragende Person nicht sehen darf, beantworten alle Endpunkte mit Projektbezug wie ein fehlendes Projekt mit 404
    `project.not_found`, so wie die Projekt-API.

    Jede wirksame Änderung wird protokolliert und erhöht die Rechteversion; Anfragen, die mit der alten Version begonnen
    haben, werden abgelehnt. Eine Änderung ohne Wirkung (dasselbe Mitglied erneut aufnehmen, eine fehlende Regel entfernen)
    schreibt nichts: keine neue Version, kein Protokolleintrag. Eine Änderung, die kein aktives Konto mit `permissions.manage` übrig ließe, wird mit 409
    `permissions.last_administrator` abgelehnt. Ebenso eine Änderung, die kein aktives lokales Konto mit den Unternehmensrechten `permissions.manage` und
    `accounts.manage` übrig ließe, solange es vorher eines gab: 409 `permissions.last_local_administrator`. Wartet eine Änderung länger als fünf Sekunden auf die Rechtesperre, antwortet
    der Server mit 503 `permissions.busy` und `Retry-After`; nichts wurde geändert. Änderungen sind wiederholbar: dasselbe
    Setzen zweimal ergibt denselben Zustand. Gruppen können noch nicht umbenannt oder gelöscht werden.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /permissions/catalog:
    get:
      operationId: getPermissionCatalog
      summary: Bekannte Aktionen und Felder
      description: Die Schlüssel, die die Fachmodule prüfen und die diese Verwaltung annimmt.
      responses:
        '200':
          description: Katalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /permissions/groups:
    get:
      operationId: listGroups
      summary: Gruppen des Unternehmens
      responses:
        '200':
          description: Nach Name sortiert
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGroup
      summary: Gruppe anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Angelegt, ohne Mitglieder und Rechte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      summary: Gruppe mit Mitgliedern, Aktionen und Feldregeln
      responses:
        '200':
          description: Gruppe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - in: path
        name: accountId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: addGroupMember
      summary: Konto in die Gruppe aufnehmen
      description: Ein unbekanntes Konto wird mit 403 abgelehnt.
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeGroupMember
      summary: Konto aus der Gruppe nehmen
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/actions:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      operationId: setGroupAction
      summary: Aktion gewähren oder entziehen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, enabled]
              properties:
                action: {type: string, description: Schlüssel aus dem Katalog}
                projectId: {type: [string, 'null'], format: uuid, description: Ohne Projekt für das Unternehmen oder alle eigenen Projekte}
                enabled: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/fields:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      operationId: setGroupField
      summary: Feldregel setzen oder entfernen
      description: |
        Neben den festen Feldern eines Tickets lassen sich die eigenen Felder eines Projekts regeln (TASK-044, DEC-073). Ihre
        Kennung ist `custom.<schlüssel>`; die Regel braucht ein `projectId`, und das Feld muss in der aktuellen Konfiguration
        des Projekts stehen, sonst antwortet der Server mit 400 und `field.unknown`. Eine Regel ohne Projekt gilt nur für die
        festen Felder. Die Felder eines Projekts, die eine Projektverwaltung vergeben darf, nennt
        `GET /permissions/projects/{projectId}/groups` unter `fields`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resourceType, field, operation, effect]
              properties:
                resourceType: {type: string, enum: [ticket]}
                field: {type: string, pattern: '^(assignee|description|status|tags|title|type|custom\.[a-z][a-z0-9_]{0,39})$'}
                projectId: {type: [string, 'null'], format: uuid}
                operation: {type: string, enum: [read, write]}
                effect: {type: string, enum: [allow, deny, remove]}
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/audit:
    get:
      operationId: getPermissionAudit
      summary: Rechteänderungen seitenweise (Recht permissions.audit.read)
      description: |
        Verlangt statt `permissions.manage` das Unternehmensrecht `permissions.audit.read`. Neueste zuerst. Die nächste Seite
        holt `before` mit der kleinsten `rightsVersion` der letzten Seite; eine leere Seite ist das Ende. So ist jeder Eintrag
        erreichbar, auch jenseits von 100.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: before
          description: Nur Einträge mit kleinerer Rechteversion.
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Protokoll
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEntry'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/projects/{projectId}/groups:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getProjectRights
      summary: Gruppen mit ihren Regeln in einem Projekt (TASK-043)
      description: |
        Für die Unternehmensverwaltung und für Projektverwaltungen dieses Projekts. Enthält jede Gruppe des Unternehmens, weil
        die Projektverwaltung die Regeln jeder Gruppe in ihrem Projekt ändern darf, aber nur deren Regeln für dieses Projekt:
        keine Mitglieder, keine Unternehmensregeln, keine Regeln anderer Projekte. `actions` und `fields` nennen, was die
        anfragende Person hier vergeben darf. Wer das Projekt sieht, aber nicht verwalten darf, erhält 403; wer es nicht
        sieht, erhält wie bei einem fehlenden Projekt 404 `project.not_found`.
      responses:
        '200':
          description: Rechte im Projekt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectRights'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    GroupId:
      in: path
      name: groupId
      required: true
      schema: {type: string, format: uuid}
  responses:
    RightLost:
      description: |
        Geändert; die anfragende Person darf die ganze Gruppe nicht lesen, weil sie damit selbst `permissions.manage` verloren
        hat oder nur ein Projekt verwaltet.
    GroupDetail:
      description: Die Gruppe nach der Änderung
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GroupDetail'}
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: request.invalid, auth.required, auth.forbidden,
        auth.password_change_required, permissions.group_not_found, project.not_found, permissions.last_administrator, permissions.last_local_administrator,
        permissions.group_name_taken (409, Name schon vergeben, ohne Rücksicht auf Groß- und Kleinschreibung),
        permissions.busy (mit Retry-After). Gründe in `violations`: name.invalid, action.unknown, action.company_only,
        enabled.required, resourceType.unknown, field.unknown, operation.invalid, effect.invalid, limit.out_of_range,
        before.out_of_range.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
        Retry-After: {schema: {type: integer}, description: Nur bei 503.}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
      additionalProperties: true
    Catalog:
      type: object
      required: [companyActions, projectActions, fields]
      properties:
        companyActions:
          type: array
          items: {type: string}
        projectActions:
          type: array
          items: {type: string}
        fields:
          type: array
          items:
            type: object
            required: [resourceType, fields]
            properties:
              resourceType: {type: string}
              fields:
                type: array
                items: {type: string}
    Group:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    GroupDetail:
      type: object
      required: [id, name, members, actions, fields]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        members:
          type: array
          items: {type: string, format: uuid}
        actions:
          type: array
          items:
            type: object
            required: [action]
            properties:
              action: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
        fields:
          type: array
          items:
            type: object
            required: [resourceType, field, operation, effect]
            properties:
              resourceType: {type: string}
              field: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
              operation: {type: string, enum: [read, write]}
              effect: {type: string, enum: [allow, deny]}
    AuditEntry:
      type: object
      required: [id, actorId, occurredAt, operation, previousRecorded, rightsVersion]
      properties:
        id: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        operation: {type: string, description: 'group.created, membership.changed, action.changed, field.read, field.write'}
        groupId: {type: [string, 'null'], format: uuid}
        subjectId: {type: [string, 'null'], format: uuid}
        projectId: {type: [string, 'null'], format: uuid}
        action: {type: [string, 'null']}
        resourceType: {type: [string, 'null']}
        field: {type: [string, 'null']}
        effect: {type: [string, 'null'], enum: [allow, deny, remove, null]}
        previousEffect:
          type: [string, 'null']
          enum: [allow, deny, null]
          description: Was die Änderung ersetzt hat; null, wenn vorher nichts galt oder der Vorzustand nicht erfasst ist.
        previousRecorded:
          type: boolean
          description: |
            Ob der Eintrag seinen Vorzustand kennt. false bei Einträgen aus der Zeit vor TASK-043; dort sagt ein fehlendes
            `previousEffect` nichts darüber, ob vorher etwas galt.
        rightsVersion: {type: integer}
    ProjectRights:
      type: object
      required: [actions, fields, groups]
      properties:
        actions:
          type: array
          description: Projektaktionen, die die anfragende Person hier vergeben darf
          items: {type: string}
        fields:
          type: array
          description: Felder je Objektart, für die sie hier Regeln setzen darf
          items:
            type: object
            required: [resourceType, fields]
            properties:
              resourceType: {type: string}
              fields:
                type: array
                items: {type: string}
        groups:
          type: array
          items: {$ref: '#/components/schemas/ProjectGroup'}
    ProjectGroup:
      type: object
      required: [id, name, actions, fields]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        actions:
          type: array
          items:
            type: object
            required: [action]
            properties:
              action: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
        fields:
          type: array
          items:
            type: object
            required: [resourceType, field, operation, effect]
            properties:
              resourceType: {type: string}
              field: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
              operation: {type: string, enum: [read, write]}
              effect: {type: string, enum: [allow, deny]}
