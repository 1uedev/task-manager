openapi: 3.1.1
info:
  title: Task Manager API, Gruppen und Rechte (TASK-030)
  version: 0.1.0
  description: |
    Verwaltung der Gruppen, ihrer Mitglieder, Aktionen und Feldregeln des Berechtigungsmoduls (TASK-025, DEC-070). Jeder
    Aufruf verlangt eine vollständige Anmeldung und das Unternehmensrecht `permissions.manage`; fehlt es, ist es veraltet
    oder ist die Anmeldung nicht mehr gültig, antwortet der Server mit 403 `auth.forbidden`, ohne den Fall zu nennen. Sitzung,
    CSRF und `Cache-Control: no-store` gelten wie im Identitätsvertrag. Feste Rollen gibt es nicht: Gruppen werden frei
    angelegt und erhalten Aktionen und Feldregeln.

    Aktionen gelten für das Unternehmen oder für ein Projekt. Die Unternehmensaktionen des Katalogs (`companyActions`) gibt es
    nur ohne Projekt. Eine Projektaktion (`projectActions`) ohne Projekt gilt in jedem Projekt, in dem das Konto Mitglied ist;
    mit Projekt nur dort. Feldregeln erlauben (`allow`) oder verbieten (`deny`) das Lesen (`read`) oder Schreiben (`write`)
    eines Feldes, `remove` entfernt die Regel. Ein Verbot gewinnt über jede Erlaubnis, Schreiben setzt Lesen voraus.
    Maßgeblich sind die Regeln aller Gruppen eines Kontos zusammen.

    Jede Änderung wird protokolliert und erhöht die Rechteversion; Anfragen, die mit der alten Version begonnen haben,
    werden abgelehnt. Eine Änderung, die kein aktives Konto mit `permissions.manage` übrig ließe, wird mit 409
    `permissions.last_administrator` abgelehnt. Wartet eine Änderung länger als fünf Sekunden auf die Rechtesperre, antwortet
    der Server mit 503 `permissions.busy` und `Retry-After`; nichts wurde geändert. Änderungen sind wiederholbar: dasselbe
    Setzen zweimal ergibt denselben Zustand. Gruppen können noch nicht umbenannt oder gelöscht werden.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /permissions/catalog:
    get:
      operationId: getPermissionCatalog
      summary: Bekannte Aktionen und Felder
      description: Die Schlüssel, die die Fachmodule prüfen und die diese Verwaltung annimmt.
      responses:
        '200':
          description: Katalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Catalog'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /permissions/groups:
    get:
      operationId: listGroups
      summary: Gruppen des Unternehmens
      responses:
        '200':
          description: Nach Name sortiert
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createGroup
      summary: Gruppe anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: Angelegt, ohne Mitglieder und Rechte
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      operationId: getGroup
      summary: Gruppe mit Mitgliedern, Aktionen und Feldregeln
      responses:
        '200':
          description: Gruppe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/members/{accountId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - in: path
        name: accountId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: addGroupMember
      summary: Konto in die Gruppe aufnehmen
      description: Ein unbekanntes Konto wird mit 403 abgelehnt.
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeGroupMember
      summary: Konto aus der Gruppe nehmen
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/actions:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      operationId: setGroupAction
      summary: Aktion gewähren oder entziehen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, enabled]
              properties:
                action: {type: string, description: Schlüssel aus dem Katalog}
                projectId: {type: [string, 'null'], format: uuid, description: Ohne Projekt für das Unternehmen oder alle eigenen Projekte}
                enabled: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/groups/{groupId}/fields:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      operationId: setGroupField
      summary: Feldregel setzen oder entfernen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resourceType, field, operation, effect]
              properties:
                resourceType: {type: string, enum: [ticket]}
                field: {type: string, enum: [assignee, description, status, tags, title, type]}
                projectId: {type: [string, 'null'], format: uuid}
                operation: {type: string, enum: [read, write]}
                effect: {type: string, enum: [allow, deny, remove]}
      responses:
        '200': {$ref: '#/components/responses/GroupDetail'}
        '204': {$ref: '#/components/responses/RightLost'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /permissions/audit:
    get:
      operationId: getPermissionAudit
      summary: Letzte Rechteänderungen (Recht permissions.audit.read)
      description: Verlangt statt `permissions.manage` das Unternehmensrecht `permissions.audit.read`. Neueste zuerst.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Protokoll
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEntry'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    GroupId:
      in: path
      name: groupId
      required: true
      schema: {type: string, format: uuid}
  responses:
    RightLost:
      description: Geändert; die anfragende Person hat damit selbst `permissions.manage` verloren und sieht die Gruppe nicht mehr.
    GroupDetail:
      description: Die Gruppe nach der Änderung
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GroupDetail'}
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: request.invalid, auth.required, auth.forbidden,
        auth.password_change_required, permissions.group_not_found, project.not_found, permissions.last_administrator,
        permissions.busy (mit Retry-After). Gründe in `violations`: name.invalid, action.unknown, action.company_only,
        enabled.required, resourceType.unknown, field.unknown, operation.invalid, effect.invalid, limit.out_of_range.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
        Retry-After: {schema: {type: integer}, description: Nur bei 503.}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
      additionalProperties: true
    Catalog:
      type: object
      required: [companyActions, projectActions, fields]
      properties:
        companyActions:
          type: array
          items: {type: string}
        projectActions:
          type: array
          items: {type: string}
        fields:
          type: array
          items:
            type: object
            required: [resourceType, fields]
            properties:
              resourceType: {type: string}
              fields:
                type: array
                items: {type: string}
    Group:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    GroupDetail:
      type: object
      required: [id, name, members, actions, fields]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        members:
          type: array
          items: {type: string, format: uuid}
        actions:
          type: array
          items:
            type: object
            required: [action]
            properties:
              action: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
        fields:
          type: array
          items:
            type: object
            required: [resourceType, field, operation, effect]
            properties:
              resourceType: {type: string}
              field: {type: string}
              projectId: {type: [string, 'null'], format: uuid}
              operation: {type: string, enum: [read, write]}
              effect: {type: string, enum: [allow, deny]}
    AuditEntry:
      type: object
      required: [id, actorId, occurredAt, operation, rightsVersion]
      properties:
        id: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        operation: {type: string, description: 'group.created, membership.changed, action.changed, field.read, field.write'}
        groupId: {type: [string, 'null'], format: uuid}
        subjectId: {type: [string, 'null'], format: uuid}
        projectId: {type: [string, 'null'], format: uuid}
        action: {type: [string, 'null']}
        resourceType: {type: [string, 'null']}
        field: {type: [string, 'null']}
        effect: {type: [string, 'null'], enum: [allow, deny, remove, null]}
        rightsVersion: {type: integer}
