openapi: 3.1.1
info:
  title: Task Manager API, Dateien und Anhänge (TASK-051)
  version: 0.1.0
  description: |
    Anhänge von Tickets (DEC-080). Alle Aufrufe verlangen eine vollständige Anmeldung; Sitzung, CSRF und
    `Cache-Control: no-store` gelten wie im Identitätsvertrag.

    Rechte: Die Anhänge sind das Ticketfeld `attachments` des Ressourcentyps `ticket`. Auflisten und Herunterladen
    verlangen `ticket.read` und eine Leseregel für dieses Feld, Hochladen und Entfernen verlangen `ticket.edit` und eine
    Schreibregel dafür. Wer das Ticket nicht lesen darf, erhält 404 `project.not_found`, wer es lesen darf, aber nicht das
    Feld, erhält 403 `auth.forbidden`. Die Kennung eines Anhangs ist kein Rechtenachweis: jeder Abruf prüft die Rechte neu,
    und der Anhang muss zu dem Ticket im Pfad gehören (sonst 404 `attachment.not_found`). Einen Anhang für Kunden oder
    Portalkonten gibt es nicht; alle Anhänge sind intern.

    Hochladen: Der Körper der Anfrage ist der Inhalt der Datei (`application/octet-stream`), der Name steht im Parameter
    `name` (URL kodiert, UTF-8). Der Server bereinigt den Namen: Pfadanteile, Steuer und Formatzeichen (auch die, die die
    Schreibrichtung umkehren) entfallen, Punkte und Leerzeichen am Ende ebenso; bleibt nichts übrig oder sind es mehr als 255
    Zeichen, gilt 400 `request.invalid` mit dem Grund `name.invalid`. Die Datei darf höchstens 25 MB (dezimal, einstellbar)
    groß sein (413 `attachment.too_large`), nicht leer sein (400 `attachment.empty`) und weder eine gesperrte Endung
    (Programme, Skripte und aktive Webinhalte wie exe, bat, js, sh, jar, html, svg) noch den Anfang eines Programms haben
    (415 `attachment.type_blocked`). Ein Virenscanner gehört nicht dazu. Eine abgewiesene Datei hinterlässt weder eine Zeile
    noch eine Datei im Speicher. Kann der Dateispeicher nicht schreiben, antwortet der Server mit 503
    `attachment.storage_unavailable`.

    Herunterladen: Der Inhalt kommt immer als Datei zum Speichern: `Content-Type: application/octet-stream`,
    `Content-Disposition: attachment`, `X-Content-Type-Options: nosniff` und eine Content-Security-Policy, die nichts erlaubt.

    Entfernen: Der Anhang verschwindet sofort aus der Liste und ist nicht mehr abrufbar; das wiederholte Entfernen ändert nichts
    (204). Der Inhalt wird nach einer Frist (7 Tage) gelöscht, die Zeile bleibt für die Historie. Hinzufügen und Entfernen
    erscheinen in der Tickethistorie (siehe tickets.openapi.yaml) und ändern die Version des Tickets nicht.

    Kann eine Sperre nicht rechtzeitig genommen werden, antwortet der Server mit 503 `attachment.busy` und `Retry-After`; die
    ganze Anfrage darf wiederholt werden.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /projects/{projectId}/tickets/{number}/attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Number'
    get:
      operationId: listAttachments
      summary: Anhänge des Tickets, älteste zuerst (ticket.read und Leseregel für attachments)
      responses:
        '200':
          description: Die nicht entfernten Anhänge
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Attachment'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: uploadAttachment
      summary: Datei anhängen (ticket.edit und Schreibregel für attachments)
      parameters:
        - name: name
          in: query
          required: true
          description: Name der Datei, URL kodiert.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Angehängt
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Attachment'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /projects/{projectId}/tickets/{number}/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/Number'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: downloadAttachment
      summary: Inhalt laden (ticket.read und Leseregel für attachments)
      responses:
        '200':
          description: Der Inhalt, immer als Datei zum Speichern
          headers:
            Content-Disposition: {schema: {type: string}, description: 'attachment mit dem Namen als filename*'}
            X-Content-Type-Options: {schema: {type: string, enum: [nosniff]}}
            Content-Security-Policy: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: removeAttachment
      summary: Anhang entfernen (ticket.edit und Schreibregel für attachments)
      responses:
        '204': {description: Entfernt oder schon entfernt}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm-session
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Number:
      name: number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    AttachmentId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: |
        Problem nach RFC 9457. Codes dieses Bereichs: request.invalid, project.not_found, ticket.not_found,
        attachment.not_found, attachment.empty, attachment.too_large, attachment.type_blocked,
        attachment.storage_unavailable, attachment.busy, request.too_large, auth.required, auth.forbidden, auth.csrf_invalid,
        auth.password_change_required. Grund in `violations`: name.invalid.
      headers:
        X-Correlation-Id: {schema: {type: string, format: uuid}}
        Retry-After: {schema: {type: integer}, description: Nur bei 503.}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [title, status, instance, code, correlationId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        instance: {type: string}
        code: {type: string}
        correlationId: {type: string, format: uuid}
        violations:
          type: array
          items: {type: string}
    Attachment:
      type: object
      required: [id, name, size, sha256, uploadedAt, uploadedBy]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255, description: Der bereinigte Name.}
        size: {type: integer, format: int64, minimum: 1, description: Größe in Bytes.}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Prüfsumme des Inhalts, Kleinbuchstaben.}
        uploadedAt: {type: string, format: date-time}
        uploadedBy: {type: string, format: uuid}
