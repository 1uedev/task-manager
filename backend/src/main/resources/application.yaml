# Required settings have no defaults. The application refuses to start until they are provided.
spring:
  application:
    name: task-manager
  datasource:
    url: ${TASK_MANAGER_DB_URL}
    username: ${TASK_MANAGER_DB_USER}
    password: ${TASK_MANAGER_DB_PASSWORD}
    hikari:
      # Every connection waits at most five seconds for a row lock; the modules answer that as retryable (busy). Until
      # TASK-043 this limit leaked from the rights check into the rest of each transaction; now it is the session default
      # and the rights check only puts it back after its own lock waits.
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the only way the schema changes. Hibernate only checks mapped entities.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${TASK_MANAGER_HTTP_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

taskmanager:
  identity:
    ldap:
      # Secrets and the private trust of the directory connection come from the environment only (TASK-046). The connection
      # itself (address, search base, filter) is an administrator setting in the database.
      bind-password: ${TASK_MANAGER_LDAP_BIND_PASSWORD:}
      trust-store: ${TASK_MANAGER_LDAP_TRUST_STORE:}
      trust-store-password: ${TASK_MANAGER_LDAP_TRUST_STORE_PASSWORD:}
  files:
    # The file store of the attachments (TASK-051) must lie on a persistent volume outside the container; the web application
    # refuses to start without it. Limits and periods have defaults in FilesProperties.
    directory: ${TASK_MANAGER_FILES_DIR:}
  helpdesk:
    # The key that encrypts the passwords of the mailboxes in the database (TASK-057): 32 random bytes in Base64. Without it
    # no mailbox with a password can be saved or read. Limits and periods have defaults in HelpdeskProperties.
    secret-key: ${TASK_MANAGER_SECRET_KEY:}
  jobs:
    # The web process runs background jobs too unless this is false; the separate process "worker" always runs them (TASK-054).
    # Limits, retries and periods have defaults in JobsProperties.
    worker-enabled: ${TASK_MANAGER_JOBS_WORKER:true}
