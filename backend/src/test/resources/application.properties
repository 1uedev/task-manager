# Tests keep many Spring contexts alive at once (one per distinct configuration) against one PostgreSQL server whose
# default limit is 100 connections. A small pool that starts with a single connection keeps all of them well below it;
# the concurrency tests need at most a handful of simultaneous connections per context.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
# Connections above the minimum go back after ten seconds without use instead of ten minutes (TASK-059, H3).
spring.datasource.hikari.idle-timeout=10000
# The web application refuses to start without a file store (TASK-051); tests use a directory of their own below the temporary one.
taskmanager.files.directory=${java.io.tmpdir}/taskmanager-test-files
# Background jobs run only in the tests that start an executor themselves (TASK-054); the others keep their database to themselves.
taskmanager.jobs.worker-enabled=false
