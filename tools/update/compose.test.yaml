# The separate test path of the update check (TASK-136, F8): the images this check builds exist only on the runner, so it
# references them by their local image identifier (sha256:...), which is as immutable as a digest of the registry. Only
# tools/update/update-check.sh adds this file; an installation never uses it.
services:
  images:
    environment:
      TASK_MANAGER_IMAGE_FORM: 'ghcr\.io/1uedev/task-manager@sha256:[0-9a-f]{64}|sha256:[0-9a-f]{64}'
      TASK_MANAGER_BACKUP_IMAGE_FORM: 'ghcr\.io/1uedev/task-manager-backup@sha256:[0-9a-f]{64}|sha256:[0-9a-f]{64}'
