name: Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tool versions
        run: |
          docker version
          docker compose version
      - name: Build and check the demonstration image with synthetic data
        env:
          IMAGE_CHECK_LOGS: image-check-app.log
        run: tools/demo/image-check.sh
      - name: Preserve image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-evidence
          retention-days: 7
          path: image-check-app.log
