name: Restore

# The restore drill of TASK-131: it plays the complete loss of the host through and measures data loss and recovery
# time. It runs on demand, weekly, and whenever the backup service, the restore, the operations module or the drill
# itself changes.
on:
  pull_request:
    branches: [main]
    paths:
      - deploy/backup/**
      - tools/restore/**
      - backend/src/main/java/taskmanager/operations/**
      - backend/src/main/resources/db/migration/**
      - .github/workflows/restore.yml
  push:
    branches: [main]
    paths:
      - deploy/backup/**
      - tools/restore/**
      - backend/src/main/java/taskmanager/operations/**
      - backend/src/main/resources/db/migration/**
      - .github/workflows/restore.yml
  schedule:
    # Weekly, as docs/OPERATIONS.md asks for recurring restore tests.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tool versions
        run: |
          docker version
          docker compose version
      - name: Play the loss of the host through and measure the restore
        env:
          RESTORE_CHECK_RESULTS: restore-results
        run: tools/restore/restore-check.sh
      - name: Preserve the evidence of the drill
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-evidence
          retention-days: 7
          path: restore-results
