name: Release

# A version of the task manager (TASK-132, DEC-162, rule 2). It exists only when Holger sets a tag vMAJOR.MINOR.PATCH on a
# commit of main; then this workflow builds the application image and the image of the backup service, publishes both in
# ghcr.io/1uedev, and puts their digests, the software bill of materials (SPDX) and the vulnerability reports together with
# the files of the operations template into the release. Without such a tag nothing is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/1uedev/task-manager
  BACKUP_IMAGE: ghcr.io/1uedev/task-manager-backup
  SYFT: anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357
  GRYPE: anchore/grype:v0.100.0@sha256:dcf0168c9b275c6dbcbff5ceeecfac29a6ccf138a87f0adc9ce5bd69fe6146f3

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # The release with its files.
      contents: write
      # The images in ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        id: tag
        run: |
          tag=$GITHUB_REF_NAME
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The tag $tag is not a version vMAJOR.MINOR.PATCH; nothing is published."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tag $tag is not on main; nothing is published."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build both images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker build --build-arg "TASK_MANAGER_VERSION=$VERSION" --build-arg "TASK_MANAGER_REVISION=$GITHUB_SHA" \
            --tag "$APP_IMAGE:$VERSION" .
          docker build --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/1uedev/task-manager" \
            --tag "$BACKUP_IMAGE:$VERSION" deploy/backup
      - name: Software bill of materials and vulnerability reports
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p release
          docker save "$APP_IMAGE:$VERSION" -o "$RUNNER_TEMP/app.tar"
          docker save "$BACKUP_IMAGE:$VERSION" -o "$RUNNER_TEMP/backup.tar"
          for part in app backup; do
            docker run --rm -v "$RUNNER_TEMP:/images:ro" -v "$PWD/release:/out" "$SYFT" \
              "docker-archive:/images/$part.tar" -o "spdx-json=/out/sbom-$part-$VERSION.spdx.json" -q
            # The report lists every finding; whether a finding blocks V1 is decided in the release check (TASK-134).
            docker run --rm -e GRYPE_CHECK_FOR_APP_UPDATE=false -v "$PWD/release:/out" "$GRYPE" \
              "sbom:/out/sbom-$part-$VERSION.spdx.json" -o table --file "/out/vulnerabilities-$part-$VERSION.txt"
            docker run --rm -e GRYPE_CHECK_FOR_APP_UPDATE=false -v "$PWD/release:/out" "$GRYPE" \
              "sbom:/out/sbom-$part-$VERSION.spdx.json" -o json --file "/out/vulnerabilities-$part-$VERSION.json"
          done
          rm -f "$RUNNER_TEMP/app.tar" "$RUNNER_TEMP/backup.tar"
      - name: Publish both images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE:$VERSION"
          docker push "$BACKUP_IMAGE:$VERSION"
          docker logout ghcr.io
          app=$(docker image inspect --format '{{index .RepoDigests 0}}' "$APP_IMAGE:$VERSION")
          backup=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BACKUP_IMAGE:$VERSION")
          case "$app$backup" in *@sha256:*@sha256:*) ;; *) echo "::error::no digest after the push"; exit 1 ;; esac
          printf 'TASK_MANAGER_IMAGE=%s\nTASK_MANAGER_BACKUP_IMAGE=%s\n' "$app" "$backup" > "release/digests-$VERSION.env"
          cat "release/digests-$VERSION.env"
      - name: Operations template of this version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bundle="$RUNNER_TEMP/task-manager-$VERSION"
          mkdir -p "$bundle/docs"
          cp deploy/compose.yaml deploy/Caddyfile deploy/db-init.sh deploy/.gitignore "$bundle/"
          # The example settings name the digests of exactly this version.
          app=$(sed -n 's/^TASK_MANAGER_IMAGE=//p' "release/digests-$VERSION.env")
          backup=$(sed -n 's/^TASK_MANAGER_BACKUP_IMAGE=//p' "release/digests-$VERSION.env")
          sed -e "s|^TASK_MANAGER_IMAGE=.*|TASK_MANAGER_IMAGE=$app|" -e "s|^TASK_MANAGER_BACKUP_IMAGE=.*|TASK_MANAGER_BACKUP_IMAGE=$backup|" \
            deploy/.env.example > "$bundle/.env.example"
          cp docs/INSTALL.md docs/BACKUP_RESTORE.md "$bundle/docs/"
          tar -C "$RUNNER_TEMP" -czf "release/task-manager-$VERSION-deploy.tar.gz" "task-manager-$VERSION"
          (cd release && sha256sum * > "SHA256SUMS-$VERSION")
      - name: Create the release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Task Manager $VERSION"
            echo
            echo "Images, only by digest (deploy/.env):"
            echo
            echo '```'
            cat "release/digests-$VERSION.env"
            echo '```'
            echo
            echo "Installation and update: docs/INSTALL.md in task-manager-$VERSION-deploy.tar.gz. Update only after a"
            echo "confirmed backup point; the way back is the restore of that point, never an older image."
            echo
            echo "Attached: software bill of materials (SPDX) and vulnerability report of both images, checksums."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Task Manager $VERSION" --notes-file "$RUNNER_TEMP/notes.md" release/*
