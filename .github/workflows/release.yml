name: Release

# A version of the task manager (TASK-132, DEC-162, rule 2). It exists only when Holger sets a tag vMAJOR.MINOR.PATCH on a
# commit of main; then this workflow builds the application image and the image of the backup service, publishes both in
# ghcr.io/1uedev, and puts their digests, the software bill of materials (SPDX) and the vulnerability reports together with
# the files of the operations template into the release. Without such a tag nothing is published.
#
# Two protections Holger sets in the settings of the repository keep a version his (TASK-136, finding F7 of the review of
# TASK-132; TASK-137, N6; docs/INSTALL.md, "Veröffentlichen einer Version"): the job "release" runs in the environment
# "release", which waits for his approval before any step and therefore before the token with packages: write exists, and
# a tag ruleset lets only him create, move or delete tags v*; neither has a bypass. The check of the tag itself is
# tools/release/check-tag.sh in the job "check", which runs at the push and before the approval; it is tested without a
# release in tests/test_release_tools.py.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/1uedev/task-manager
  BACKUP_IMAGE: ghcr.io/1uedev/task-manager-backup
  SYFT: anchore/syft:v1.33.0@sha256:f94e5d9fce1f2278491a8e3a63bd5f6ddb81fdfdbb8bf7a1637565c1d5344357
  GRYPE: anchore/grype:v0.100.0@sha256:dcf0168c9b275c6dbcbff5ceeecfac29a6ccf138a87f0adc9ce5bd69fe6146f3

jobs:
  # The check of the tag at the moment it was pushed, before any approval and with read rights only (TASK-137, finding N6 of
  # the review of TASK-136): a tag on a commit that is not on main at that moment never reaches the approval, also when the
  # commit comes to main later. The release job builds exactly the commit this job checked.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        id: tag
        run: |
          git fetch --no-tags origin main
          version=$(bash tools/release/check-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" origin/main)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      # The release with its files.
      contents: write
      # The images in ghcr.io.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.commit }}
      - name: The tag still names the checked commit
        id: tag
        env:
          CHECKED: ${{ needs.check.outputs.commit }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A tag moved during the wait for the approval is refused; the ruleset should already prevent it.
          git fetch --no-tags origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          now=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          [ "$now" = "$CHECKED" ] && [ "$(git rev-parse HEAD)" = "$CHECKED" ] \
            || { echo "::error::the tag no longer names the checked commit; nothing is published"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build both images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          docker build --build-arg "TASK_MANAGER_VERSION=$VERSION" --build-arg "TASK_MANAGER_REVISION=$GITHUB_SHA" \
            --tag "$APP_IMAGE:$VERSION" .
          docker build --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/1uedev/task-manager" \
            --tag "$BACKUP_IMAGE:$VERSION" deploy/backup
      - name: Software bill of materials and vulnerability reports
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p release
          docker save "$APP_IMAGE:$VERSION" -o "$RUNNER_TEMP/app.tar"
          docker save "$BACKUP_IMAGE:$VERSION" -o "$RUNNER_TEMP/backup.tar"
          for part in app backup; do
            docker run --rm -v "$RUNNER_TEMP:/images:ro" -v "$PWD/release:/out" "$SYFT" \
              "docker-archive:/images/$part.tar" -o "spdx-json=/out/sbom-$part-$VERSION.spdx.json" -q
            # The report lists every finding; whether a finding blocks V1 is decided in the release check (TASK-134).
            docker run --rm -e GRYPE_CHECK_FOR_APP_UPDATE=false -v "$PWD/release:/out" "$GRYPE" \
              "sbom:/out/sbom-$part-$VERSION.spdx.json" -o table --file "/out/vulnerabilities-$part-$VERSION.txt"
            docker run --rm -e GRYPE_CHECK_FOR_APP_UPDATE=false -v "$PWD/release:/out" "$GRYPE" \
              "sbom:/out/sbom-$part-$VERSION.spdx.json" -o json --file "/out/vulnerabilities-$part-$VERSION.json"
          done
          rm -f "$RUNNER_TEMP/app.tar" "$RUNNER_TEMP/backup.tar"
          # The ssh client of the backup image comes from the Debian sources at the build; its version is in the bill of
          # materials, and the release names it (H4 of the review of TASK-132).
          ssh=$(jq -r '[.packages[] | select(.name == "openssh-client") | .versionInfo] | first // empty' \
            "release/sbom-backup-$VERSION.spdx.json")
          [ -n "$ssh" ] || { echo "::error::the bill of materials of the backup image names no openssh-client"; exit 1; }
          echo "openssh-client $ssh" | tee "release/ssh-client-$VERSION.txt"
      - name: Publish both images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$APP_IMAGE:$VERSION"
          docker push "$BACKUP_IMAGE:$VERSION"
          docker logout ghcr.io
          app=$(docker image inspect --format '{{index .RepoDigests 0}}' "$APP_IMAGE:$VERSION")
          backup=$(docker image inspect --format '{{index .RepoDigests 0}}' "$BACKUP_IMAGE:$VERSION")
          case "$app" in "$APP_IMAGE@sha256:"*) ;; *) echo "::error::no digest of $APP_IMAGE after the push"; exit 1 ;; esac
          case "$backup" in "$BACKUP_IMAGE@sha256:"*) ;; *) echo "::error::no digest of $BACKUP_IMAGE after the push"; exit 1 ;; esac
          # Only the digests: the template puts them behind the fixed names of the registry (TASK-137, N7).
          printf 'TASK_MANAGER_IMAGE_DIGEST=%s\nTASK_MANAGER_BACKUP_IMAGE_DIGEST=%s\n' "${app#*@}" "${backup#*@}" \
            > "release/digests-$VERSION.env"
          cat "release/digests-$VERSION.env"
      - name: Operations template of this version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # deploy/ with every file the template mounts and .env.example with the digests of exactly this version, the
          # operation guides with the guides they link, and the restore check; a dead link refuses the bundle.
          python3 tools/release/bundle.py "$VERSION" "release/digests-$VERSION.env" "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -czf "release/task-manager-$VERSION-deploy.tar.gz" "task-manager-$VERSION"
          # The package as an operator receives it: unpacked alone, resolved with and without the proxy file (TASK-137, N11).
          sh tools/release/check-package.sh "release/task-manager-$VERSION-deploy.tar.gz" "$VERSION"
          (cd release && sha256sum * > "SHA256SUMS-$VERSION")
      - name: Create the release
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Task Manager $VERSION"
            echo
            echo "Images, only by digest (deploy/.env):"
            echo
            echo '```'
            cat "release/digests-$VERSION.env"
            echo '```'
            echo
            echo "Installation and update: docs/INSTALL.md in task-manager-$VERSION-deploy.tar.gz, the template in its"
            echo "directory deploy/. Registries needed: ghcr.io for both images, docker.io for postgres and caddy. Update only after a"
            echo "confirmed backup point; the way back is the restore of that point, never an older image."
            echo
            echo "Attached: software bill of materials (SPDX) and vulnerability report of both images, checksums."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Task Manager $VERSION" --notes-file "$RUNNER_TEMP/notes.md" release/*
